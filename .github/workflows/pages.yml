name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Opencaching consumer keys (public, read-only). Set in GitHub: Settings -> Secrets and
      # variables -> Actions -> Variables. Empty = geocaching stays off.
      VITE_OKAPI_KEY_DE: ${{ vars.OKAPI_KEY_DE }}
      VITE_OKAPI_KEY_PL: ${{ vars.OKAPI_KEY_PL }}
      VITE_OKAPI_KEY_NL: ${{ vars.OKAPI_KEY_NL }}
      VITE_OKAPI_KEY_RO: ${{ vars.OKAPI_KEY_RO }}
      VITE_OKAPI_KEY_UK: ${{ vars.OKAPI_KEY_UK }}
      VITE_OKAPI_KEY_US: ${{ vars.OKAPI_KEY_US }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build          # main site  -> dist/
      - run: npm run build:beta     # beta site  -> dist/beta/ (experiments on, separate profile)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
